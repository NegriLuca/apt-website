{% extends "base.html" %}
{% block title %}{{ _('Access Not Available') }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="main-content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body py-5">
                    <i class="bi bi-shield-lock-fill text-accent" style="font-size: 4rem;"></i>
                    <h2 class="mt-3 fw-bold">{{ _('Access Not Available') }}</h2>
                    <div class="alert bg-dark text-white border-0 mt-4">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        {{ _('This access link has been disabled. Please contact the host.') }}
                    </div>
                    <div class="mt-4">
                        <a href="{{ url_for('routes.home') }}" class="btn-luxury-outline py-2 px-4 text-decoration-none d-inline-block">
                            <i class="bi bi-house me-1"></i>{{ _('Back to Home') }}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
