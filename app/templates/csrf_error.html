{% extends "base.html" %}

{% block title %}{{ _('Request Expired') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="bi bi-shield-exclamation" style="font-size: 4rem; color: var(--color-accent);"></i>
            </div>
            <h2>{{ _('Session Expired') }}</h2>
            <p class="text-muted mb-4">{{ _('Your form session expired. Please go back and try again — your security is important to us.') }}</p>
            <a href="{{ url_for('routes.home') }}" class="btn-luxury-primary">{{ _('Back to Home') }}</a>
        </div>
    </div>
</div>
{% endblock %}
