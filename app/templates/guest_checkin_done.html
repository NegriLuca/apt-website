{% extends "base.html" %}
{% block title %}{{ _('Check-in Completed') }}{% endblock %}

{% block content %}
<div class="main-content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm text-center py-5">
                <div class="card-body">
                    <i class="bi bi-check-circle-fill text-accent" style="font-size: 4rem;"></i>
                    <h3 class="mt-3 fw-bold">{{ _('Check-in Completed!') }}</h3>
                    <p class="text-muted">{{ message }}</p>
                    <div class="mt-4">
                        <a href="{{ url_for('routes.home') }}" class="btn-luxury-outline py-2 px-4 text-decoration-none d-inline-block">
                            <i class="bi bi-house me-1"></i>{{ _('Back to Home') }}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
