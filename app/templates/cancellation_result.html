{% extends "base.html" %}

{% block title %}{{ _('Reservation Cancellation') }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5 text-center">
        
        {% if success %}
          <div class="mb-4 text-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
              <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
          </div>
          <h2 class="h4 mb-3 text-dark">{{ _('Cancellation Confirmed') }}</h2>
          <div class="alert alert-success border-0 bg-success-subtle text-success-emphasis py-3 mb-4">
            {{ message }}
          </div>
        {% else %}
          <div class="mb-4 text-warning">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
              <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
          </div>
          <h2 class="h4 mb-3 text-dark">{{ _('Unable to Cancel') }}</h2>
          <div class="alert alert-warning border-0 bg-warning-subtle text-warning-emphasis py-3 mb-4">
            {{ message }}
          </div>
        {% endif %}

        <hr class="my-4 text-muted opacity-25">

        <a href="{{ url_for('routes.home') }}" class="btn btn-primary btn-lg w-100">
          {{ _('Return to Homepage') }}
        </a>
        
      </div>
    </div>
  </div>
</div>
{% endblock %}
