{% extends "base.html" %}

{% block title %}{{ _('Reservation Cancellation') }}{% endblock %}

{% block content %}
<div class="main-content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4 p-md-5 text-center">
                {% if success %}
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                </div>
                <h1 class="page-title mb-2">{{ _('Cancellation Confirmed') }}</h1>
                <div class="alert alert-success border-0 bg-accent-light text-primary py-3 mb-4">
                    {{ message }}
                </div>
                {% else %}
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
                </div>
                <h1 class="page-title mb-2">{{ _('Unable to Cancel') }}</h1>
                <div class="alert alert-warning border-0 bg-warning-subtle text-warning-dark py-3 mb-4">
                    {{ message }}
                </div>
                {% endif %}

                <hr class="my-4 opacity-25">

                <a href="{{ url_for('routes.home') }}" class="btn-luxury-primary w-100 py-3 fw-bold">
                    {{ _('Return to Homepage') }}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
