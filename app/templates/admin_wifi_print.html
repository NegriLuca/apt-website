<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Guest Wi-Fi') }} — {{ apartment.name or 'Lotto 235 Garbatella' }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f2f2f2; }
        .card {
            width: 180mm;
            min-height: 120mm;
            margin: 20px auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .title { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 18px; }
        img.qr {
            width: 150mm;
            height: 150mm;
            max-width: 90vw;
            object-fit: contain;
            margin: 6px 0 22px;
        }
        .network-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 3px; }
        .network-value { font-size: 26px; font-weight: 700; margin-bottom: 14px; word-break: break-word; }
        .password-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 3px; }
        .password-value { font-size: 20px; font-weight: 600; word-break: break-word; margin-bottom: 12px; }
        .band { font-size: 13px; color: #555; margin-top: 4px; }
        @media print {
            body { background: #fff; }
            .card { border: none; border-radius: 0; margin: 0; width: 100%; min-height: 100vh; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">{{ _('Guest Wi-Fi') }}</div>
        <div class="subtitle">{{ _('Scan to connect') }}</div>
        <img class="qr" src="{{ qr_data_uri }}" alt="{{ _('Wi-Fi QR code') }}">
        <div class="network-label">{{ _('Network') }}</div>
        <div class="network-value">{{ apartment.wifi_ssid }}</div>
        {% if apartment.wifi_password %}
        <div class="password-label">{{ _('Password') }}</div>
        <div class="password-value">{{ apartment.wifi_password }}</div>
        {% endif %}
        {% if apartment.wifi_band %}
        <div class="band">{{ apartment.wifi_band }}</div>
        {% endif %}
    </div>
    <script>window.onload = function () { window.print(); };</script>
</body>
</html>
