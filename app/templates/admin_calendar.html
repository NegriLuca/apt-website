{% extends "base.html" %}

{% block title %}Admin Calendar{% endblock %}

{% block content %}
<div class="container">
    {% include 'admin_header.html' %}
    <!-- Nuova Legenda Dinamica -->
    <div class="mb-4 d-flex flex-wrap gap-2 align-items-center">
        <small class="text-muted fw-bold me-2">Legend:</small>
        <span class="badge bg-success">Direct (Confirmed)</span>
        <span class="badge" style="background-color: #ffc107; color: #000;">Pending Verification</span>
        <span class="badge" style="background-color: #ff5a5f;">Airbnb</span>
        <span class="badge" style="background-color: #003580;">Booking.com</span>
        <span class="badge bg-dark">Cancelled</span>
    </div>

    <div class="card shadow-sm mb-5 border-0">
        <div class="card-body p-3">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<style>
    .fc { font-family: inherit; background: #ffffff; }
    .fc-header-toolbar { padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 20px !important; }
    .fc .fc-button-primary { background-color: #343a40 !important; border-color: #343a40 !important; }
    
    /* Eventi: altezza fissa e testo troncato per non rompere il layout */
    .fc-event { 
        cursor: pointer; 
        padding: 2px 4px; 
        font-size: 0.75rem; 
        border: none !important; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        white-space: nowrap; 
    }
    .pending-event { background-color: #ffc107 !important; color: #000 !important; border-left: 3px solid #d39e00 !important; }
</style>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        eventSources: [{
            url: "{{ url_for('routes.api_calendar_reservations') }}",
            success: function(content) {
                // Modifica dinamica degli eventi prima di renderli
                return content.map(function(event) {
                    // Imposta classe speciale se pending
                    if (event.extendedProps.status === 'pending') {
                        event.classNames = ['pending-event'];
                    }
                    // Aggiungi il metodo di pagamento al titolo se disponibile
                    let method = event.extendedProps.payment_method ? event.extendedProps.payment_method.toUpperCase() : 'N/A';
                    event.title = event.title + ' (' + method + ')';
                    return event;
                });
            }
        }],
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        eventClick: function(info) {
            let details = info.event.extendedProps;
            alert(
                "📋 Booking Details\n" +
                "-----------------------------------\n" +
                "Guest: " + info.event.title + "\n" +
                "Source: " + details.source.toUpperCase() + "\n" +
                "Payment: " + (details.payment_method || 'N/A').toUpperCase() + "\n" +
                "Status: " + details.status.toUpperCase() + " | " + details.payment_status.toUpperCase() + "\n" +
                "Revenue: " + details.total
            );
        }
    });
    calendar.render();
});
</script>
{% endblock %}
