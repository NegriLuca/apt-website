{% extends "base.html" %}

{% block title %}{{ _('Admin Calendar') }}{% endblock %}

{% block content %}
<div class="container">
    {% include 'admin_header.html' %}
    
    <div class="mb-4 d-flex flex-wrap gap-2 align-items-center">
        <small class="text-muted fw-bold me-2">{{ _('Legend:') }}</small>
        <span class="badge bg-success">{{ _('Direct (Confirmed)') }}</span>
        <span class="badge bg-warning text-dark">{{ _('Pending Verification') }}</span>
        <span class="badge" style="background-color: #ff5a5f; color: #fff;">Airbnb</span>
        <span class="badge" style="background-color: #003580; color: #fff;">Booking.com</span>
        <span class="badge bg-dark">{{ _('Cancelled') }}</span>
    </div>

    <div class="card shadow-sm mb-5 border-0">
        <div class="card-body p-3">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<style>
    .fc { font-family: var(--font-sans); background: var(--color-bg-white); }
    .fc-header-toolbar { padding: var(--space-sm); background: var(--color-bg-alt); border-radius: var(--radius-md); margin-bottom: var(--space-lg) !important; }
    .fc .fc-button-primary { background-color: var(--color-primary) !important; border-color: var(--color-primary) !important; }
    
    .fc-event { 
        cursor: pointer; 
        padding: var(--space-xs) var(--space-sm); 
        font-size: var(--font-size-xs); 
        border: none !important; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        white-space: nowrap; 
    }
    .pending-event { background-color: var(--color-warning) !important; color: var(--color-primary) !important; border-left: 3px solid var(--color-warning) !important; }
</style>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        eventSources: [{
            url: "{{ url_for('routes.api_calendar_reservations') }}",
            success: function(content) {
                return content.map(function(event) {
                    if (event.extendedProps.status === 'pending') {
                        event.classNames = ['pending-event'];
                    }
                    let method = event.extendedProps.payment_method ? event.extendedProps.payment_method.toUpperCase() : 'N/A';
                    event.title = event.title + ' (' + method + ')';
                    return event;
                });
            }
        }],
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        eventClick: function(info) {
            let details = info.event.extendedProps;
            alert(
                "📋 {{ _('Booking Details') }}\n" +
                "-----------------------------------\n" +
                "{{ _('Guest:') }} " + info.event.title + "\n" +
                "{{ _('Source:') }} " + details.source.toUpperCase() + "\n" +
                "{{ _('Payment:') }} " + (details.payment_method || 'N/A').toUpperCase() + "\n" +
                "{{ _('Status:') }} " + details.status.toUpperCase() + " | " + details.payment_status.toUpperCase() + "\n" +
                "{{ _('Revenue:') }} " + details.total
            );
        }
    });
    calendar.render();
});
</script>
{% endblock %}
