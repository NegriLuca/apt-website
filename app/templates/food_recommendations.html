{% extends "base.html" %}

{% block title %}Food & Drinks{% endblock %}

{% block content %}

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>


<h2>🍝🍸 Food & Drinks</h2>
<p class="lead">
Discover our favorite places to eat, drink, and experience the real Rome – just a few minutes from your apartment.
</p>

<div class="tag" id="contextTag">⭐ Curated local picks near Garbatella</div>

<!-- FILTERS -->
<div id="filters">
  <button class="filter active" data-type="all">🌍 All</button>
  <button class="filter" data-type="curated">⭐ Curated</button>
  <button class="filter" data-type="pasta">🍝 Trattorie</button>
  <button class="filter" data-type="pizza">🍕 Pizza</button>
  <button class="filter" data-type="coffee">☕ Cafés</button>
  <button class="filter" data-type="drinks">🍸 Drinks</button>
  <button class="filter" data-type="restaurant">🍴 Restaurants</button>
</div>

<div class="page">
  <div id="sidebar">
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

  // 🏠 BnB
  const bnb = [41.86731700, 12.49094300];

  const map = L.map('map').setView(bnb, 15);

  // modern map (not grey)
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    { attribution: '&copy; OpenStreetMap & CARTO' }
  ).addTo(map);

  // =========================
  // ICONS (emoji markers)
  // =========================
const icons = {
  restaurant: L.divIcon({
    className: "emoji-icon",
    html: "<div class='pin'>🍴</div>"
  }),

  pasta: L.divIcon({
    className: "emoji-icon",
    html: "<div class='pin'>🍝</div>"
  }),

  pizza: L.divIcon({
    className: "emoji-icon",
    html: "<div class='pin'>🍕</div>"
  }),

  coffee: L.divIcon({
    className: "emoji-icon",
    html: "<div class='pin'>☕</div>"
  }),

  drinks: L.divIcon({
    className: "emoji-icon",
    html: "<div class='pin'>🍸</div>"
  }),

  home: L.divIcon({
    className: "emoji-home",
    html: "<div class='pin-home'>🏠</div>"
  })
};
  // 🏠 BnB marker
  L.marker(bnb, { icon: icons.home })
    .addTo(map)
    .bindPopup("<b>Your BnB</b><br>Via Circonvallazione Ostiense 235");

  // =========================
  // DATA
  // =========================
  const places = [
    {
      name: "Porto Fluviale",
      category: "🍝 Restaurants",
      type: "restaurant",
      desc: "Modern trattoria (8 min walk)",
      coords: [41.8725121,12.4752003,17],
      url: "https://maps.app.goo.gl/R3XybNG6XBTwsnmr8"
    },
    {
      name: "Mariu Trattoria Gentile ⭐",
      category: "🍝 Restaurants",
      type: "pasta",
      desc: "Cozy Roman cuisine (4 min walk)",
      coords: [41.8679796, 12.4938781,17],
      url: "https://maps.app.goo.gl/aY3j2bvSebzQ6Fgz5"
    },
    {
      name: "Trattoria da Me (Garbatella)",
      category: "🍝 Restaurants",
      type: "pasta",
      desc: "Authentic Roman dishes (5 min walk)",
      coords: [41.8663237,12.4880734,17],
      url: "https://maps.app.goo.gl/SuQnhNMFUvLZLXp77"
    },
    {
      name: "Tanto pe' Magna",
      category: "🍝 Restaurants",
      type: "pasta",
      desc: "Informal Roman restaurant (10 min walk)",
      coords: [41.8613652,12.4911645,17],
      url: "https://maps.app.goo.gl/mfww4D1RxmgoXZUEA"
    },
    {
      name: "Ar Grottino der Traslocatore ⭐",
      category: "🍝 Restaurants",
      type: "pasta",
      desc: "Very authentic Roman trattoria (15 min walk)",
      coords: [41.8604954,12.4846997,17],
      url: "https://maps.app.goo.gl/DmitSWJfEZwQZ9Ww9"
    },
    {
      name: "Eataly Roma",
      category: "🍝 Restaurants",
      type: "restaurant",
      desc: "Large Italian food hall (10 min walk)",
      coords: [41.8711959,12.4817421,16],
      url: "https://maps.app.goo.gl/TgY3UYhoL91Qwuya9"
    },

    {
      name: "Panonto",
      category: "🍕 Pizzerias",
      type: "pizza",
      desc: "Casual pizza (13 min walk)",
      coords: [41.8624022,12.4849386,17],
      url: "https://maps.app.goo.gl/gg2xmbsXN7nKT3Bc8"
    },
    {
      name: "Donna Cira",
      category: "🍕 Pizzerias",
      type: "pizza",
      desc: "Popular local pizzeria (15 min walk)",
      coords: [41.8720865,12.4809422,16],
      url: "https://maps.app.goo.gl/UTNc3xuPK6hXfA6e6"
    },

    {
      name: "Nero Vaniglia ⭐",
      category: "☕ Cafés",
      type: "coffee",
      desc: "Modern pastry shop (1 min walk)",
      coords: [41.8674526,12.4899657,17],
      url: "https://maps.app.goo.gl/DKDodvhsHYczV8hx6"
    },

    {
      name: "Biffi ⭐",
      category: "🍸 Drinks",
      type: "drinks",
      desc: "Perfect for a quick drink (2 min walk)",
      coords: [41.8667445,12.4898635,17],
      url: "https://maps.app.goo.gl/gTZCXr1YvEHNr5pp7"
    },
    {
      name: "Bauhaus Rome",
      category: "🍸 Drinks",
      type: "drinks",
      desc: "Stylish cocktail bar (2 min walk)",
      coords: [41.8663237,12.4880734,17],
      url: "https://maps.app.goo.gl/jFGVwpifDd1gsZ2t6"
    }
  ];

  // =========================
  // MARKERS
  // =========================
  const list = document.getElementById("list");
  const markers = [];

  places.forEach(p => {

    const marker = L.marker(p.coords, {
      icon: icons[p.type] || icons.restaurant
    }).addTo(map);

    marker.bindPopup(`
      <b>${p.name}</b><br>
      <small>${p.desc}</small><br><br>
      <a href="${p.url}" target="_blank">📍 Open in Google Maps</a>
    `);

    markers.push({ marker, data: p });
  });

  // =========================
  // SIDEBAR (grouped)
  // =========================
  const sidebarItems = [];
  const grouped = {};

  places.forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = [];
    grouped[p.category].push(p);
  });

  Object.keys(grouped).forEach(cat => {

    const title = document.createElement("h4");
    title.innerText = cat;
    title.style.marginTop = "14px";
    list.appendChild(title);

    grouped[cat].forEach(p => {

      const div = document.createElement("div");
      div.className = "item";
      div.dataset.type = p.type;

      const markerObj = markers.find(m => m.data.name === p.name);

      div.innerHTML = `
        <strong>${p.name}</strong><br>
        <small>${p.desc}</small>
      `;

      div.onclick = () => {
        map.setView(p.coords, 17);
        markerObj.marker.openPopup();
      };

      div.onmouseenter = () => {
        markerObj.marker.openPopup();
      };

      list.appendChild(div);
    });
  });  
  
  // =========================
  // FILTERS
  // =========================
  const tag = document.getElementById("contextTag");

  const tagText = {
    all: "⭐ Curated local picks near Garbatella",
    pasta: "🍝 Best traditional Roman trattorie nearby",
    pizza: "🍕 Best pizza spots near Garbatella",
    coffee: "☕ Best cafés & breakfast spots nearby",
    drinks: "🍸 Aperitivo & nightlife near Garbatella",
    restaurant: "🍴 Top restaurants around Garbatella"
  };

  const buttons = document.querySelectorAll(".filter");

  buttons.forEach(btn => {
    btn.onclick = () => {

      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

    const type = btn.dataset.type;

    // update tag text (optional)
    tag.innerText = tagText[type] || tagText.all;

    // MARKERS FILTER
    markers.forEach(obj => {

      const p = obj.data;

      let match = false;

      if (type === "all") match = true;
      else if (type === "curated") match = p.name.includes("⭐");
      else match = p.type === type;

      if (match) map.addLayer(obj.marker);
      else map.removeLayer(obj.marker);
    });

    // SIDEBAR FILTER
    document.querySelectorAll(".item").forEach(el => {

      const isCurated = el.innerText.includes("⭐");

      let match = false;

      if (type === "all") match = true;
      else if (type === "curated") match = isCurated;
      else match = el.dataset.type === type;

      el.style.display = match ? "block" : "none";
    });    
  };
  });
</script>

{% endblock %}
