<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Apartment{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Your custom CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="d-flex">

  <!-- Sidebar -->
  <nav class="bg-primary text-white p-3" style="width: 240px; min-height: 100vh;">
    <h4 class="mb-4">My Apartment</h4>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('routes.home') }}">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('routes.apartment') }}">Apartment</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('routes.reserve') }}">Reserve</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('routes.food_recommendations') }}">Food & Drinks</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('routes.attractions') }}">Attractions</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('routes.faq') }}">FAQ</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('routes.contact') }}">Contact</a>
      </li>

      <hr class="text-white">

      {% if current_user.is_authenticated %}
        {% if current_user.is_admin %}
        <li class="nav-item">
          <a class="nav-link text-white" href="{{ url_for('routes.admin_dashboard') }}">Admin</a>
        </li>
        {% endif %}
        <li class="nav-item">
          <a class="nav-link text-white" href="{{ url_for('routes.logout') }}">Logout</a>
        </li>
      {% else %}
        <li class="nav-item">
          <a class="nav-link text-white" href="{{ url_for('routes.login') }}">Login</a>
        </li>
      {% endif %}
    </ul>
  </nav>

  <!-- Main content -->
  <main class="flex-grow-1 p-4" style="background:#f4f6f8;">
    <div class="container-xl">
      <div class="main-content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </main>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
